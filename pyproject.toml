[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "staylens"
version = "0.2.0"
description = "Reproducible Berlin listing price estimates and API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4", "pandas==3.1.0", "scikit-learn==1.9.1",
  "joblib==1.6.0", "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "matplotlib==3.11.2", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
